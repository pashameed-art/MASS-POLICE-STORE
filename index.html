/* ===== reports.js ===== */
/* ==========================================================================
   reports.js
   Pure, side-effect-free calculations over entries[]. No DOM code here —
   dashboard.js (and future V2 modules) render whatever this returns.
   ========================================================================== */

window.MUS = window.MUS || {};

MUS.Reports = (function () {
  function entriesForMonth(entries, monthStr) {
    return entries.filter((e) => e.date.slice(0, 7) === monthStr);
  }

  function monthlyTotals(entries, monthStr) {
    const monthEntries = entriesForMonth(entries, monthStr);
    let sale = 0, expense = 0, credit = 0, purchase = 0;
    monthEntries.forEach((e) => {
      if (e.type === "sale") sale += e.amount;
      if (e.type === "expense") expense += e.amount;
      if (e.type === "credit") credit += e.amount;
      if (e.type === "purchase") purchase += e.amount;
      if (e.type === "supplierPayment") purchase += e.amount;
    });
    const net = sale + credit - expense - purchase;
    return { sale, expense, credit, purchase, net, entries: monthEntries };
  }

  function groupByDate(entries) {
    const map = {};
    entries.forEach((e) => { (map[e.date] = map[e.date] || []).push(e); });
    return Object.keys(map).sort((a, b) => (a < b ? 1 : -1)).map((date) => ({ date, entries: map[date] }));
  }

  function todayNet(entries, todayStr) {
    return entries
      .filter((e) => e.date === todayStr)
      .reduce((s, e) => {
        if (e.type === "expense" || e.type === "purchase" || e.type === "supplierPayment") return s - e.amount;
        if (e.type === "creditGiven" || e.type === "supplierCredit") return s;
        return s + e.amount;
      }, 0);
  }

  function customerBalances(entries) {
    const map = {};
    entries.forEach((e) => {
      const name = (e.customer || "").trim();
      if (!name) return;
      if (!map[name]) map[name] = { given: 0, paid: 0, phone: "" };
      if (e.type === "creditGiven") {
        map[name].given += e.amount;
        if (e.phone) map[name].phone = e.phone;
      }
      if (e.type === "credit") map[name].paid += e.amount;
    });
    return Object.entries(map)
      .map(([name, v]) => ({ name, ...v, balance: v.given - v.paid }))
      .filter((c) => c.given > 0 || c.paid > 0)
      .sort((a, b) => b.balance - a.balance);
  }

  /* Balance for one specific customer by exact name (case-insensitive). Used
     by the Bill screen's "customer info" box so it doesn't have to compute
     the full customerBalances() list on every keystroke. */
  function customerBalanceFor(entries, name) {
    const target = (name || "").trim().toLowerCase();
    if (!target) return { given: 0, paid: 0, balance: 0 };
    let given = 0, paid = 0;
    entries.forEach((e) => {
      if ((e.customer || "").trim().toLowerCase() !== target) return;
      if (e.type === "creditGiven") given += e.amount;
      if (e.type === "credit") paid += e.amount;
    });
    return { given, paid, balance: given - paid };
  }

  function supplierBalances(entries) {
    const map = {};
    entries.forEach((e) => {
      const name = (e.customer || "").trim();
      if (!name) return;
      if (!map[name]) map[name] = { owed: 0, paid: 0 };
      if (e.type === "supplierCredit") map[name].owed += e.amount;
      if (e.type === "supplierPayment") map[name].paid += e.amount;
    });
    return Object.entries(map)
      .map(([name, v]) => ({ name, ...v, balance: v.owed - v.paid }))
      .filter((s) => s.owed > 0 || s.paid > 0)
      .sort((a, b) => b.balance - a.balance);
  }

  /* ------------------------------------------------------------------
     Profit
     Profit per invoice item = (Selling Rate - Purchase Rate) x Qty.
     purchaseRate is a snapshot stored on the item at sale time (see
     sales.js generateInvoice), so profit stays correct even if a
     product's purchase rate changes later.
     ------------------------------------------------------------------ */
  function invoiceProfit(invoice) {
    return (invoice.items || []).reduce((sum, it) => {
      const pr = it.purchaseRate || 0;
      return sum + (it.rate - pr) * it.qty;
    }, 0);
  }

  function profitForInvoices(invoices, predicate) {
    return invoices.filter(predicate).reduce((sum, inv) => sum + invoiceProfit(inv), 0);
  }

  function dailyProfit(invoices, dateStr) {
    return profitForInvoices(invoices, (inv) => inv.date === dateStr);
  }
  function monthlyProfit(invoices, monthStr) {
    return profitForInvoices(invoices, (inv) => inv.date.slice(0, 7) === monthStr);
  }
  function yearlyProfit(invoices, yearStr) {
    return profitForInvoices(invoices, (inv) => inv.date.slice(0, 4) === yearStr);
  }

  /* ------------------------------------------------------------------
     Dashboard summary
     ------------------------------------------------------------------ */
  function todaysSales(invoices, dateStr) {
    return invoices.filter((inv) => inv.date === dateStr).reduce((s, inv) => s + inv.total, 0);
  }

  /* ------------------------------------------------------------------
     Reports
     ------------------------------------------------------------------ */

  /* 1. Daily Sales Report — one row per day: invoice count, sales, profit */
  function dailySalesReport(invoices) {
    const map = {};
    invoices.forEach((inv) => {
      if (!map[inv.date]) map[inv.date] = { date: inv.date, count: 0, sales: 0, profit: 0 };
      map[inv.date].count += 1;
      map[inv.date].sales += inv.total;
      map[inv.date].profit += invoiceProfit(inv);
    });
    return Object.values(map).sort((a, b) => (a.date < b.date ? 1 : -1));
  }

  /* 2. Monthly Sales Report — one row per month */
  function monthlySalesReport(invoices) {
    const map = {};
    invoices.forEach((inv) => {
      const m = inv.date.slice(0, 7);
      if (!map[m]) map[m] = { month: m, count: 0, sales: 0, profit: 0 };
      map[m].count += 1;
      map[m].sales += inv.total;
      map[m].profit += invoiceProfit(inv);
    });
    return Object.values(map).sort((a, b) => (a.month < b.month ? 1 : -1));
  }

  /* 3. Product Wise Profit — grouped by product (falls back to the raw
     description for older / manual lines with no linked product). */
  function productWiseProfit(invoices) {
    const map = {};
    invoices.forEach((inv) => {
      (inv.items || []).forEach((it) => {
        const key = it.productId || it.desc;
        if (!map[key]) map[key] = { name: it.desc, qty: 0, sales: 0, profit: 0 };
        map[key].qty += it.qty;
        map[key].sales += it.qty * it.rate;
        map[key].profit += (it.rate - (it.purchaseRate || 0)) * it.qty;
      });
    });
    return Object.values(map).sort((a, b) => b.profit - a.profit);
  }

  /* 4. Company Wise Sales — grouped by company snapshot on each item */
  function companyWiseSales(invoices) {
    const map = {};
    invoices.forEach((inv) => {
      (inv.items || []).forEach((it) => {
        const company = it.company || "Other";
        if (!map[company]) map[company] = { company, qty: 0, sales: 0, profit: 0 };
        map[company].qty += it.qty;
        map[company].sales += it.qty * it.rate;
        map[company].profit += (it.rate - (it.purchaseRate || 0)) * it.qty;
      });
    });
    return Object.values(map).sort((a, b) => b.sales - a.sales);
  }

  /* 5. Customer Pending Report — reuses customerBalances(), kept as its
     own named entry point so the Reports screen has one function per
     report, matching the spec's five report types. */
  function customerPendingReport(entries) {
    return customerBalances(entries).filter((c) => c.balance > 0);
  }

  return {
    entriesForMonth, monthlyTotals, groupByDate, todayNet,
    customerBalances, customerBalanceFor, supplierBalances,
    invoiceProfit, dailyProfit, monthlyProfit, yearlyProfit, todaysSales,
    dailySalesReport, monthlySalesReport, productWiseProfit, companyWiseSales, customerPendingReport,
  };
})();


/* ===== dashboard.js ===== */
/* ==========================================================================
   dashboard.js
   Renders the Ledger tab: today strip, monthly summary cards, customer &
   supplier balance lists, the grouped entries list, and the New Entry
   modal. All numbers come from reports.js — this file only draws them.
   ========================================================================== */

window.MUS = window.MUS || {};

MUS.Dashboard = (function () {
  const { esc, money, fmtDate, todayStr, uid } = MUS.Utils;

  let filterMonth = todayStr().slice(0, 7);
  const EXPENSE_CATEGORIES = ["Breakfast", "Lunch", "Dinner", "Tea", "Juice", "Car Rent", "Diesel", "Room Rent", "Movie", "Tea & Cigarette"];

  function renderTodayStrip() {
    const state = MUS.App.state;
    const net = MUS.Reports.todayNet(state.entries, todayStr());
    document.getElementById("todayStrip").innerHTML = `
      <div><div style="color:#9CA8B5;font-size:12px;">Today</div><div style="color:var(--cream);font-size:15px;font-weight:600;">${fmtDate(todayStr())}</div></div>
      <div style="text-align:right;"><div style="color:#9CA8B5;font-size:12px;">Today's Net</div>
        <div style="color:${net >= 0 ? "#8FBF7F" : "#E28E7D"};font-size:18px;font-weight:800;">${money(net)}</div></div>`;
  }

  function summaryCard(label, value, color, bold) {
    return `<div class="card"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><span style="font-size:12px;color:#6b6455;">${label}</span></div>
      <div style="font-size:${bold ? 19 : 17}px;font-weight:800;color:${color};">${money(value)}</div></div>`;
  }

  function render() {
    const state = MUS.App.state;
    const totals = MUS.Reports.monthlyTotals(state.entries, filterMonth);
    const grouped = MUS.Reports.groupByDate(totals.entries);
    const customerBalances = MUS.Reports.customerBalances(state.entries);
    const supplierBalances = MUS.Reports.supplierBalances(state.entries);

    let html = `
      <div style="padding:16px 14px 4px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <span class="stencil" style="font-size:11px;color:#6b6455;">Monthly Summary</span>
          <input type="month" value="${filterMonth}" onchange="MUS.Dashboard.setFilterMonth(this.value)" class="field-input" style="width:auto;padding:4px 8px;font-size:13px;">
        </div>
        <div class="grid2">
          ${summaryCard("Sales", totals.sale, "#4A5D3A")}
          ${summaryCard("Expenses", totals.expense, "#8B3A2E")}
          ${summaryCard("Purchases", totals.purchase, "#5A4632")}
          ${summaryCard("Credit Received", totals.credit, "#B8860B")}
        </div>
        <div style="margin-top:10px;">${summaryCard("Net Profit", totals.net, "#1C2B3A", true)}</div>
      </div>`;

    if (customerBalances.length) {
      html += `<div style="padding:6px 14px 4px;"><span class="stencil" style="font-size:11px;color:#6b6455;">Customer Balances</span><div style="margin-top:8px;">`;
      customerBalances.forEach((c) => {
        html += `<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border-style:dashed;">
          <div><div style="font-size:14px;font-weight:700;">${esc(c.name)}</div>
            <div style="font-size:11px;color:var(--muted);">Given ${money(c.given)} · Paid ${money(c.paid)}${c.phone ? ` · ${esc(c.phone)}` : ""}</div></div>
          <div style="text-align:right;"><div style="font-size:11px;color:var(--muted);">Balance</div>
            <div style="font-size:15px;font-weight:800;color:${c.balance > 0 ? "#8B3A2E" : "#4A5D3A"};">${money(c.balance)}</div></div>
        </div>`;
      });
      html += `</div></div>`;
    }

    if (supplierBalances.length) {
      html += `<div style="padding:6px 14px 4px;"><span class="stencil" style="font-size:11px;color:#6b6455;">Supplier Balances</span><div style="margin-top:8px;">`;
      supplierBalances.forEach((s) => {
        html += `<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border-style:dashed;border-color:#2E4057;">
          <div><div style="font-size:14px;font-weight:700;">${esc(s.name)}</div>
            <div style="font-size:11px;color:var(--muted);">Owed ${money(s.owed)} · Paid ${money(s.paid)}</div></div>
          <div style="text-align:right;"><div style="font-size:11px;color:var(--muted);">Balance</div>
            <div style="font-size:15px;font-weight:800;color:${s.balance > 0 ? "#2E4057" : "#1C6758"};">${money(s.balance)}</div></div>
        </div>`;
      });
      html += `</div></div>`;
    }

    html += `<div style="padding:10px 14px;">`;
    if (grouped.length === 0) {
      html += `<div style="text-align:center;color:#9a9280;padding:40px 10px;font-size:14px;">No entries yet for this month.<br>Tap the + button below to add one.</div>`;
    }
    grouped.forEach(({ date, entries }) => {
      html += `<div style="margin-bottom:18px;"><div class="stencil" style="font-size:11px;color:#8a8270;margin-bottom:8px;padding-left:4px;">${fmtDate(date)}</div>`;
      entries.forEach((e) => {
        const t = MUS.Types[e.type];
        html += `<div class="card" style="margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <div style="display:flex;align-items:center;gap:10px;min-width:0;">
            <div style="width:8px;height:34px;border-radius:4px;background:${t.color};flex-shrink:0;"></div>
            <div style="min-width:0;">
              <div style="font-size:14px;font-weight:600;">${t.label}${e.customer ? ` · ${esc(e.customer)}` : ""}</div>
              ${e.note ? `<div style="font-size:12px;color:#8a8270;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(e.note)}</div>` : ""}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <span style="font-weight:800;font-size:15px;color:${t.color};">${t.sign > 0 ? "+" : t.sign < 0 ? "−" : ""}${money(e.amount)}</span>
            <button onclick="MUS.Dashboard.deleteEntry('${e.id}')" style="background:none;border:none;padding:4px;color:#c2a28a;font-size:16px;">🗑</button>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;

    document.getElementById("ledgerView").innerHTML = html;
    renderTodayStrip();
  }

  function setFilterMonth(v) { filterMonth = v; render(); }

  function deleteEntry(id) {
    MUS.App.state.entries = MUS.App.state.entries.filter((e) => e.id !== id);
    MUS.App.saveState();
    render();
  }

  /* ---------------- New Entry modal ---------------- */
  let entryForm = {};

  function openEntryForm() {
    entryForm = { type: "sale", amount: "", note: "", customer: "", phone: "", date: todayStr() };
    MUS.App.openModal(entryModalHtml());
  }
  function refreshEntryModal() {
    MUS.App.openModal(entryModalHtml());
  }

  function entryModalHtml() {
    const typeButtons = Object.entries(MUS.Types)
      .filter(([k]) => k !== "purchase" && k !== "supplierCredit")
      .map(([key, t]) => `
        <button onclick="MUS.Dashboard.setEntryType('${key}')" style="padding:10px 4px;border-radius:10px;font-weight:700;font-size:13px;
          border:2px solid ${entryForm.type === key ? t.color : "var(--border)"};
          background:${entryForm.type === key ? t.color + "1a" : "#fff"};color:${entryForm.type === key ? t.color : "#8a8270"};">${t.label}</button>`).join("");

    const catChips = entryForm.type === "expense" ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
      ${EXPENSE_CATEGORIES.map((cat) => `<button onclick="MUS.Dashboard.setEntryNote('${cat}')" style="padding:6px 10px;border-radius:16px;font-size:12px;font-weight:600;
        border:${entryForm.note === cat ? "2px solid #8B3A2E" : "1px solid var(--border)"};background:${entryForm.note === cat ? "#8B3A2E1a" : "#fff"};color:${entryForm.note === cat ? "#8B3A2E" : "#6b6455"};">${cat}</button>`).join("")}
      </div>` : "";

    const isPartyType = ["creditGiven", "credit", "supplierPayment"].includes(entryForm.type);
    const partyLabel = entryForm.type === "supplierPayment" ? "Enter the supplier name to track their balance" : "Enter the customer name to track their balance";
    const partyHint = isPartyType ? `<div style="font-size:11px;color:var(--brass);margin-bottom:4px;">${partyLabel}</div>` : "";

    const phoneField = entryForm.type === "creditGiven" ? `
      <label class="field-label">Phone Number</label>
      <input type="tel" inputmode="tel" class="field-input" style="margin-bottom:12px;" value="${esc(entryForm.phone)}" oninput="MUS.Dashboard.setEntryField('phone', this.value)" placeholder="10-digit mobile number">` : "";

    return `
    <div class="modal-overlay" onclick="MUS.App.closeModal()">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <div class="stencil" style="font-size:13px;font-weight:700;">New Entry</div>
          <button onclick="MUS.App.closeModal()" style="background:none;border:none;font-size:18px;">✕</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">${typeButtons}</div>
        <label class="field-label">Amount (₹)</label>
        <input type="number" inputmode="decimal" class="field-input" style="font-size:20px;font-weight:700;margin-bottom:12px;" value="${entryForm.amount}" oninput="MUS.Dashboard.setEntryField('amount', this.value)" placeholder="0">
        <label class="field-label">${entryForm.type === "supplierPayment" ? "Supplier Name" : "Customer Name"} (optional)</label>
        ${partyHint}
        <input type="text" class="field-input" style="margin-bottom:12px;" value="${esc(entryForm.customer)}" oninput="MUS.Dashboard.setEntryField('customer', this.value)" placeholder="Name">
        ${phoneField}
        <label class="field-label">Note (optional)</label>
        ${catChips}
        <input type="text" class="field-input" style="margin-bottom:12px;" value="${esc(entryForm.note)}" oninput="MUS.Dashboard.setEntryField('note', this.value)" placeholder="e.g. 3 shirts, 2 pants">
        <label class="field-label">Date</label>
        <input type="date" class="field-input" style="margin-bottom:18px;" value="${entryForm.date}" oninput="MUS.Dashboard.setEntryField('date', this.value)">
        <button class="btn-primary" onclick="MUS.Dashboard.saveEntry()">Add Entry</button>
      </div>
    </div>`;
  }

  function setEntryType(type) { entryForm.type = type; refreshEntryModal(); }
  function setEntryNote(note) { entryForm.note = note; refreshEntryModal(); }
  function setEntryField(field, value) { entryForm[field] = value; }

  function saveEntry() {
    const amt = parseFloat(entryForm.amount);
    if (!amt || amt <= 0) return;
    MUS.App.addEntry({
      id: uid(), type: entryForm.type, amount: amt,
      note: entryForm.note.trim(), customer: entryForm.customer.trim(),
      phone: (entryForm.phone || "").trim(), date: entryForm.date,
    });
    MUS.App.saveState();
    MUS.App.closeModal();
    render();
  }

  /* ==========================================================================
     Dashboard tab — summary cards, low-stock warnings, and the Reports modal.
     Everything here reads from MUS.Reports / MUS.Products / MUS.Customers —
     no calculations happen in this file, only rendering.
     ========================================================================== */

  function dashCard(label, value, color) {
    return `<div class="card"><div style="font-size:11px;color:#6b6455;margin-bottom:4px;">${label}</div>
      <div style="font-size:18px;font-weight:800;color:${color};">${value}</div></div>`;
  }

  function renderDashboard() {
    const state = MUS.App.state;
    const today = todayStr();
    const todaysSales = MUS.Reports.todaysSales(state.invoices, today);
    const todaysProfit = MUS.Reports.dailyProfit(state.invoices, today);
    const monthProfit = MUS.Reports.monthlyProfit(state.invoices, today.slice(0, 7));
    const yearProfit = MUS.Reports.yearlyProfit(state.invoices, today.slice(0, 4));
    const pendingCustomerAmount = MUS.Reports.customerBalances(state.entries).reduce((s, c) => s + Math.max(0, c.balance), 0);
    const stockValue = MUS.Products.stockValue(state);
    const lowStock = MUS.Products.lowStockList(state);
    const totalCustomers = MUS.Customers.list(state).length;

    const lowStockHtml = lowStock.length ? `
      <div style="padding:6px 14px 4px;">
        <span class="stencil" style="font-size:11px;color:#6b6455;">⚠ Low Stock</span>
        <div style="margin-top:8px;">
          ${lowStock.map((p) => `
            <div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border-color:#8B3A2E;">
              <span style="font-size:13px;font-weight:700;">${esc(p.productName)}</span>
              <span style="font-size:12px;font-weight:700;color:#8B3A2E;background:#8B3A2E1a;padding:3px 8px;border-radius:6px;">
                ${MUS.Products.currentStock(p)} left (min ${p.minStock})</span>
            </div>`).join("")}
        </div>
      </div>` : "";

    document.getElementById("dashboardView").innerHTML = `
      <div style="padding:16px 14px 100px;">
        <div class="grid2" style="margin-bottom:10px;">
          ${dashCard("Today's Sales", money(todaysSales), "#4A5D3A")}
          ${dashCard("Today's Profit", money(todaysProfit), "#1C6758")}
          ${dashCard("Pending Customer Amt", money(pendingCustomerAmount), "#8B3A2E")}
          ${dashCard("Stock Value", money(stockValue), "#5A4632")}
          ${dashCard("Low Stock Items", lowStock.length, lowStock.length > 0 ? "#8B3A2E" : "#4A5D3A")}
          ${dashCard("Total Customers", totalCustomers, "#6b5b95")}
        </div>

        <div class="card" style="margin-bottom:10px;">
          <div class="stencil" style="font-size:11px;color:#6b6455;margin-bottom:8px;">Profit Summary</div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><span>This Month</span><span style="font-weight:800;color:#1C6758;">${money(monthProfit)}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:13px;"><span>This Year</span><span style="font-weight:800;color:#1C6758;">${money(yearProfit)}</span></div>
        </div>

        ${lowStockHtml}

        <button class="btn-primary" onclick="MUS.Dashboard.openReports()" style="margin-top:6px;">📈 View Reports</button>
      </div>`;
  }

  /* ---------------- Reports modal ---------------- */
  let activeReport = "daily";
  const REPORT_TABS = [
    { key: "daily", label: "Daily Sales" },
    { key: "monthly", label: "Monthly Sales" },
    { key: "productProfit", label: "Product Profit" },
    { key: "companySales", label: "Company Sales" },
    { key: "pending", label: "Customer Pending" },
  ];

  function openReports() {
    activeReport = "daily";
    MUS.App.openModal(reportsModalHtml());
  }
  function setReportView(key) {
    activeReport = key;
    MUS.App.openModal(reportsModalHtml());
  }

  function reportsModalHtml() {
    const state = MUS.App.state;
    const tabsHtml = REPORT_TABS.map((t) => `
      <button onclick="MUS.Dashboard.setReportView('${t.key}')" style="padding:8px 10px;border-radius:16px;font-size:11px;font-weight:700;flex-shrink:0;
        border:2px solid ${activeReport === t.key ? "var(--navy)" : "var(--border)"};
        background:${activeReport === t.key ? "var(--navy)" : "#fff"};color:${activeReport === t.key ? "var(--cream)" : "#6b6455"};">${t.label}</button>`).join("");

    let body = "";
    if (activeReport === "daily") {
      const rows = MUS.Reports.dailySalesReport(state.invoices);
      body = rows.length ? rows.map((r) => `
        <div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-size:13px;font-weight:700;">${fmtDate(r.date)}</div><div style="font-size:11px;color:#8a8270;">${r.count} bill${r.count !== 1 ? "s" : ""}</div></div>
          <div style="text-align:right;"><div style="font-size:14px;font-weight:800;color:#4A5D3A;">${money(r.sales)}</div><div style="font-size:11px;color:#1C6758;">Profit ${money(r.profit)}</div></div>
        </div>`).join("") : emptyMsg("No sales yet.");
    } else if (activeReport === "monthly") {
      const rows = MUS.Reports.monthlySalesReport(state.invoices);
      body = rows.length ? rows.map((r) => `
        <div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-size:13px;font-weight:700;">${r.month}</div><div style="font-size:11px;color:#8a8270;">${r.count} bill${r.count !== 1 ? "s" : ""}</div></div>
          <div style="text-align:right;"><div style="font-size:14px;font-weight:800;color:#4A5D3A;">${money(r.sales)}</div><div style="font-size:11px;color:#1C6758;">Profit ${money(r.profit)}</div></div>
        </div>`).join("") : emptyMsg("No sales yet.");
    } else if (activeReport === "productProfit") {
      const rows = MUS.Reports.productWiseProfit(state.invoices);
      body = rows.length ? rows.map((r) => `
        <div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-size:13px;font-weight:700;">${esc(r.name)}</div><div style="font-size:11px;color:#8a8270;">Qty sold: ${r.qty}</div></div>
          <div style="text-align:right;"><div style="font-size:14px;font-weight:800;color:#4A5D3A;">${money(r.sales)}</div><div style="font-size:11px;color:#1C6758;">Profit ${money(r.profit)}</div></div>
        </div>`).join("") : emptyMsg("No sales yet.");
    } else if (activeReport === "companySales") {
      const rows = MUS.Reports.companyWiseSales(state.invoices);
      body = rows.length ? rows.map((r) => `
        <div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-size:13px;font-weight:700;">${esc(r.company)}</div><div style="font-size:11px;color:#8a8270;">Qty sold: ${r.qty}</div></div>
          <div style="text-align:right;"><div style="font-size:14px;font-weight:800;color:#4A5D3A;">${money(r.sales)}</div><div style="font-size:11px;color:#1C6758;">Profit ${money(r.profit)}</div></div>
        </div>`).join("") : emptyMsg("No sales yet.");
    } else if (activeReport === "pending") {
      const rows = MUS.Reports.customerPendingReport(state.entries);
      body = rows.length ? rows.map((c) => `
        <div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-size:13px;font-weight:700;">${esc(c.name)}</div><div style="font-size:11px;color:#8a8270;">Given ${money(c.given)} · Paid ${money(c.paid)}</div></div>
          <div style="font-size:15px;font-weight:800;color:#8B3A2E;">${money(c.balance)}</div>
        </div>`).join("") : emptyMsg("No pending customer balances.");
    }

    return `
    <div class="modal-overlay" onclick="MUS.App.closeModal()">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div class="stencil" style="font-size:13px;font-weight:700;">Reports</div>
          <button onclick="MUS.App.closeModal()" style="background:none;border:none;font-size:18px;">✕</button>
        </div>
        <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;">${tabsHtml}</div>
        ${body}
        <button class="btn-primary" style="margin-top:6px;" onclick="MUS.App.closeModal()">Done</button>
      </div>
    </div>`;
  }
  function emptyMsg(text) {
    return `<div style="text-align:center;color:#9a9280;padding:30px 10px;font-size:13px;">${text}</div>`;
  }

  return {
    render, renderTodayStrip, setFilterMonth, deleteEntry, openEntryForm, setEntryType, setEntryNote, setEntryField, saveEntry,
    renderDashboard, openReports, setReportView,
  };
})();



/* ===== app.js ===== */
/* ==========================================================================
   app.js
   Orchestrates the whole app: owns the single in-memory `state` object,
   wires up tab switching, generic modal open/close, the Shop Settings
   modal, and boots everything on load. Every feature module (Products,
   Purchase, Sales, Dashboard) talks to state only through MUS.App.
   ========================================================================== */

window.MUS = window.MUS || {};

MUS.App = (function () {
  let state = null;
  let currentTab = "ledger";

  /* ---------------- State helpers (shared by every module) ---------------- */
  function addEntry(entry) {
    state.entries.unshift(entry);
  }
  function saveState() {
    MUS.Storage.save(state);
  }

  /* ---------------- Generic modal plumbing ---------------- */
  function openModal(html) {
    document.getElementById("modalRoot").innerHTML = html;
  }
  function closeModal() {
    document.getElementById("modalRoot").innerHTML = "";
    render();
  }

  /* ---------------- Tabs ---------------- */
  function switchTab(tab) {
    currentTab = tab;
    const dashBtn = document.getElementById("tabDashboardBtn");
    const ledgerBtn = document.getElementById("tabLedgerBtn");
    const billBtn = document.getElementById("tabBillBtn");
    const active = { background: "var(--navy)", color: "var(--cream)", border: "2px solid var(--navy)" };
    const inactive = { background: "#fff", color: "#6b6455", border: "2px solid var(--border)" };
    Object.assign(dashBtn.style, tab === "dashboard" ? active : inactive);
    Object.assign(ledgerBtn.style, tab === "ledger" ? active : inactive);
    Object.assign(billBtn.style, tab === "bill" ? active : inactive);

    document.getElementById("dashboardView").classList.toggle("hidden", tab !== "dashboard");
    document.getElementById("ledgerView").classList.toggle("hidden", tab !== "ledger");
    document.getElementById("billView").classList.toggle("hidden", tab !== "bill");
    document.getElementById("fabAdd").classList.toggle("hidden", tab !== "ledger");
    document.getElementById("headerTitle").textContent =
      tab === "dashboard" ? "Dashboard" : tab === "ledger" ? "Daily Accounts" : "Create Bill";
    document.getElementById("todayStrip").style.display = tab === "ledger" ? "flex" : "none";
    render();
  }

  function render() {
    try {
      if (currentTab === "dashboard") {
        MUS.Dashboard.renderDashboard();
      } else if (currentTab === "ledger") {
        MUS.Dashboard.render();
      } else {
        MUS.Sales.render();
        MUS.Dashboard.renderTodayStrip();
      }
    } catch (err) {
      console.error("Render error on tab '" + currentTab + "':", err);
      showRenderError(err);
    }
  }

  function showRenderError(err) {
    const containerId = currentTab === "dashboard" ? "dashboardView" : currentTab === "ledger" ? "ledgerView" : "billView";
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = `
      <div style="padding:20px 14px;">
        <div class="card" style="border-color:#8B3A2E;">
          <div style="font-weight:800;color:#8B3A2E;margin-bottom:6px;">⚠ Something went wrong loading this screen</div>
          <div style="font-size:12px;color:#6b6455;font-family:monospace;word-break:break-word;">${MUS.Utils.esc(err && err.message ? err.message : String(err))}</div>
          <div style="font-size:12px;color:#8a8270;margin-top:8px;">Try switching tabs again. If this keeps happening, the app files may need re-downloading.</div>
        </div>
      </div>`;
  }

  /* ---------------- Shop Settings modal ---------------- */
  function openShopSettings() {
    const s = state.shopInfo;
    const lastBackup = state.lastBackupAt ? MUS.Utils.fmtDate(state.lastBackupAt) : "Never";
    const html = `
    <div class="modal-overlay" onclick="MUS.App.closeModal()">
      <div class="modal-sheet" onclick="event.stopPropagation()" style="max-height:80vh;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <div class="stencil" style="font-size:13px;font-weight:700;">Shop Details</div>
          <button onclick="MUS.App.closeModal()" style="background:none;border:none;font-size:18px;">✕</button>
        </div>
        <label class="field-label">Shop Name</label>
        <input type="text" class="field-input" id="shopName" style="margin-bottom:10px;" value="${MUS.Utils.esc(s.name)}">
        <label class="field-label">Address</label>
        <input type="text" class="field-input" id="shopAddress" style="margin-bottom:10px;" value="${MUS.Utils.esc(s.address)}">
        <label class="field-label">Phone Number</label>
        <input type="text" class="field-input" id="shopPhone" style="margin-bottom:18px;" value="${MUS.Utils.esc(s.phone)}">
        <button class="btn-primary" onclick="MUS.App.saveShopSettings()">Save</button>

        <div class="card" style="margin-top:18px;">
          <div class="stencil" style="font-size:11px;color:#6b6455;margin-bottom:8px;">Backup & Restore</div>
          <div style="font-size:12px;color:#8a8270;margin-bottom:10px;">Last backup: <b style="color:var(--navy);">${lastBackup}</b></div>
          <button class="btn-gold" style="margin-bottom:8px;" onclick="MUS.App.exportBackup()">💾 Backup Data (Download)</button>
          <input type="file" id="restoreFileInput" accept="application/json" style="display:none;" onchange="MUS.App.importBackup(this.files[0])">
          <button class="btn-primary" onclick="document.getElementById('restoreFileInput').click()">📂 Restore from Backup</button>
        </div>
      </div>
    </div>`;
    openModal(html);
  }
  function saveShopSettings() {
    state.shopInfo = {
      name: document.getElementById("shopName").value,
      address: document.getElementById("shopAddress").value,
      phone: document.getElementById("shopPhone").value,
    };
    saveState();
    closeModal();
  }

  /* ---------------- Backup & Restore ---------------- */
  function exportBackup() {
    try {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `mus-backup-${MUS.Utils.todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);

      state.lastBackupAt = MUS.Utils.todayStr();
      saveState();
      closeModal();
      alert("Backup downloaded! Keep this file safe (e.g. save it to Google Drive or WhatsApp it to yourself).");
    } catch (err) {
      console.error("Backup failed:", err);
      alert("Backup failed: " + err.message);
    }
  }

  function importBackup(file) {
    if (!file) return;
    const ok = window.confirm("Restoring will REPLACE all current data (ledger, bills, products, customers) with the backup file. Continue?");
    if (!ok) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        state = Object.assign(MUS.Storage.defaultState(), parsed);
        saveState();
        closeModal();
        switchTab("dashboard");
        alert("Backup restored successfully!");
      } catch (err) {
        console.error("Restore failed:", err);
        alert("Restore failed — this doesn't look like a valid backup file.");
      }
    };
    reader.readAsText(file);
  }

  function checkBackupReminder() {
    const last = state.lastBackupAt;
    const daysSince = last ? Math.floor((new Date(MUS.Utils.todayStr()) - new Date(last)) / 86400000) : Infinity;
    if (daysSince < 7) return;

    const banner = document.createElement("div");
    banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#B8860B;color:#1C2B3A;padding:10px 14px;font-size:13px;font-weight:700;z-index:100;display:flex;justify-content:space-between;align-items:center;gap:10px;";
    banner.innerHTML = `<span>⚠️ ${last ? `It's been ${daysSince} days since your last backup.` : "You haven't backed up your data yet."} Back up weekly to avoid losing data.</span>`;
    const btn = document.createElement("button");
    btn.textContent = "Backup Now";
    btn.style.cssText = "background:#1C2B3A;color:#F3EFE3;border:none;border-radius:6px;padding:6px 10px;font-weight:700;font-size:12px;flex-shrink:0;";
    btn.onclick = () => { banner.remove(); exportBackup(); };
    const closeBtn = document.createElement("button");
    closeBtn.textContent = "✕";
    closeBtn.style.cssText = "background:none;border:none;color:#1C2B3A;font-size:16px;flex-shrink:0;";
    closeBtn.onclick = () => banner.remove();
    banner.appendChild(btn);
    banner.appendChild(closeBtn);
    document.body.prepend(banner);

    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    } else if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification("Mass Uniform Store", { body: "Weekly backup reminder — please back up your data." }); } catch (e) {}
    }
  }

  /* ---------------- Boot ---------------- */
  function init() {
    try {
      state = MUS.Storage.load();
      switchTab("dashboard");
      checkBackupReminder();
    } catch (err) {
      console.error("App failed to start:", err);
      document.body.innerHTML = `
        <div style="padding:24px 16px;font-family:sans-serif;">
          <div style="font-weight:800;color:#8B3A2E;font-size:16px;margin-bottom:8px;">⚠ App failed to start</div>
          <div style="font-size:13px;color:#444;font-family:monospace;word-break:break-word;">${(err && err.message) || err}</div>
          <div style="font-size:13px;color:#666;margin-top:12px;">Please make sure all files (index.html, css/, js/) were unzipped together into the same folder, then reopen index.html.</div>
        </div>`;
    }
  }

  return {
    get state() { return state; },
    addEntry, saveState, openModal, closeModal, switchTab, render,
    openShopSettings, saveShopSettings, exportBackup, importBackup, init,
  };
})();

document.addEventListener("DOMContentLoaded", MUS.App.init);

</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => console.error("SW registration failed:", err));
    });
  }
</script>
</body>
</html>
